<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>LiDECX</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --accent-1: #a78bfa;
      --accent-2: #60a5fa;
      --bg: #03050a;
      --glass-bg: rgba(12, 15, 24, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    .bg-mesh {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-mesh::before {
      content: "";
      position: absolute;
      top: -20%;
      left: -20%;
      width: 70%;
      height: 70%;
      background: radial-gradient(circle at 30% 30%, rgba(96, 165, 250, 0.25), transparent 60%);
      filter: blur(100px);
      animation: drift 18s infinite alternate ease-in-out;
    }

    .bg-mesh::after {
      content: "";
      position: absolute;
      bottom: -15%;
      right: -15%;
      width: 65%;
      height: 65%;
      background: radial-gradient(circle at 70% 70%, rgba(167, 139, 250, 0.3), transparent 60%);
      filter: blur(110px);
      animation: drift 22s infinite alternate-reverse ease-in-out;
    }

    @keyframes drift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(4%, 5%) scale(1.15); }
    }

    .card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 400px;
      background: var(--glass-bg);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 2.5rem;
      border: 1px solid var(--border);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.08);
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.4s ease, border-color 0.3s;
    }

    .card:hover {
      border-color: rgba(255,255,255,0.14);
    }

    .avatar-group {
      position: relative;
      margin-bottom: 1.8rem;
    }

    .avatar-ring {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--accent-1), var(--accent-2), var(--accent-1));
      filter: blur(12px);
      opacity: 0.7;
      animation: rotateGlow 8s linear infinite;
    }

    @keyframes rotateGlow {
      to { transform: rotate(360deg); }
    }

    .avatar {
      width: 90px;
      height: 90px;
      background: linear-gradient(145deg, #111827, #0b0f1a);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 600;
      color: white;
      position: relative;
      z-index: 2;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 15px 30px -10px rgba(0,0,0,0.7);
      letter-spacing: -0.5px;
    }

    .name {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(to bottom, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.2rem;
      text-align: center;
    }

    .username {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--accent-2);
      background: rgba(96, 165, 250, 0.12);
      padding: 0.3rem 1.2rem;
      border-radius: 30px;
      margin-bottom: 2rem;
      letter-spacing: 0.3px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(96, 165, 250, 0.25);
    }

    .bio-panel {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 1.8rem;
      padding: 1.5rem 1.3rem;
      margin-bottom: 2rem;
      border: 1px solid rgba(255,255,255,0.04);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      position: relative;
    }

    .bio-panel:hover {
      background: rgba(0, 0, 0, 0.5);
      border-color: rgba(255,255,255,0.1);
      box-shadow: 0 20px 30px -15px rgba(0,0,0,0.5);
    }

    .bio-icon {
      font-size: 1.1rem;
      font-weight: 600;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
    }

    .bio-icon span {
      background: rgba(167, 139, 250, 0.2);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #c4b5fd;
    }

    .bio-text {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.6;
      font-weight: 350;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .bio-text i {
      font-style: normal;
      margin-right: 0.4rem;
      opacity: 0.8;
    }

    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      padding: 0.95rem 1.2rem;
      border-radius: 1.3rem;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255,255,255,0.06);
      color: #f8fafc;
      font-weight: 500;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1);
      backdrop-filter: blur(10px);
      letter-spacing: 0.2px;
    }

    .link-btn svg {
      width: 1.3rem;
      height: 1.3rem;
      fill: currentColor;
      opacity: 0.9;
      transition: transform 0.3s;
    }

    .link-btn:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255,255,255,0.18);
      transform: translateY(-2px);
      box-shadow: 0 12px 22px -10px rgba(0,0,0,0.6);
    }

    .link-btn:hover svg {
      transform: translateX(2px);
    }

    .primary-btn {
      background: linear-gradient(105deg, rgba(96, 165, 250, 0.2) 0%, rgba(167, 139, 250, 0.15) 100%);
      border-color: rgba(139, 92, 246, 0.35);
      box-shadow: 0 8px 18px -8px rgba(96, 165, 250, 0.25);
    }

    .primary-btn:hover {
      background: linear-gradient(105deg, rgba(96, 165, 250, 0.3) 0%, rgba(167, 139, 250, 0.25) 100%);
      border-color: rgba(167, 139, 250, 0.55);
      box-shadow: 0 14px 24px -8px rgba(139, 92, 246, 0.4);
    }

    .fade-up {
      animation: fadeUp 0.7s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(18px);
    }

    .d1 { animation-delay: 0.05s; }
    .d2 { animation-delay: 0.15s; }
    .d3 { animation-delay: 0.25s; }
    .d4 { animation-delay: 0.35s; }
    .d5 { animation-delay: 0.45s; }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 420px) {
      .card {
        padding: 2rem 1.5rem;
        border-radius: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>

  <main class="card">
    <div class="avatar-group fade-up d1">
      <div class="avatar-ring"></div>
      <div class="avatar">М</div>
    </div>

    <h1 class="name fade-up d2">Михаил</h1>
    <div class="username fade-up d3">@LiDECX</div>

    <div class="bio-panel fade-up d4">
      <div class="bio-icon">
        ⚡ <span>Programming & Vibe Coding</span>
      </div>
      <div class="bio-text">
        <div>Создаю сайты и простые сервисы. Работаю с HTML, JavaScript и Python. Развиваюсь в веб-разработке и постепенно расширяю навыки.</div>
      </div>
    </div>

    <div class="actions fade-up d5">
      <a href="https://t.me/News_by_LiDECX" target="_blank" rel="noopener" class="link-btn primary-btn">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.19-.08-.05-.19-.02-.27 0-.12.03-1.98 1.26-5.59 3.7-.53.36-1.01.54-1.44.53-.48-.01-1.39-.27-2.07-.49-.83-.27-1.49-.41-1.43-.87.03-.24.34-.49.92-.75 3.6-1.56 6-2.59 7.2-3.09 3.43-1.43 4.14-1.68 4.61-1.69.1 0 .33.02.48.14.12.1.16.24.18.34.01.07.01.16 0 .25z"/>
        </svg>
        Мой канал
      </a>

      <a href="https://t.me/Portfolio_by_LiDECX" target="_blank" rel="noopener" class="link-btn">
        <svg viewBox="0 0 24 24">
          <path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/>
        </svg>
        Портфолио
      </a>
    </div>
  </main>
</body>
</html>
